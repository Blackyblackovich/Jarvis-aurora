<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0614">
<title>Jarvis · Aurora</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Marcellus&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0614;--card:#150f26;--card2:#1c1432;--brd:rgba(255,255,255,.08);
--acc:#c084fc;--acc2:#f472b6;--acc3:#22d3ee;--grn:#34d399;--red:#fb7185;--amb:#fbbf24;
--txt:#f4f0fb;--mut:#a99cc4;--dim:#6b5f85;--mono:'JetBrains Mono',monospace;--sans:'Space Grotesk',sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden}
#stars{position:absolute;inset:0}
.aur{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;transition:background 1s}
.a1{width:380px;height:380px;background:#a855f7;top:-100px;left:-70px;animation:fl1 14s ease-in-out infinite}
.a2{width:340px;height:340px;background:#ec4899;bottom:-90px;right:-60px;animation:fl2 18s ease-in-out infinite}
.a3{width:280px;height:280px;background:#06b6d4;top:35%;right:10%;animation:fl1 22s ease-in-out infinite reverse}
body.bg2 .a1{background:#10b981}body.bg2 .a2{background:#06b6d4}body.bg2 .a3{background:#3b82f6}
body.bg3 .a1{background:#f97316}body.bg3 .a2{background:#ef4444}body.bg3 .a3{background:#f43f5e}
@keyframes fl1{50%{transform:translate(70px,60px) scale(1.3)}}
@keyframes fl2{50%{transform:translate(-60px,-70px) scale(1.25)}}
#lock{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:.65s cubic-bezier(.5,0,.2,1)}
#lock.hide{opacity:0;transform:translateY(-40px) scale(1.03);pointer-events:none}
#lcTime{font-family:var(--mono);font-size:66px;font-weight:700;letter-spacing:-2px;background:linear-gradient(135deg,#fff,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px rgba(192,132,252,.4))}
#lcDate{font-size:15px;color:var(--mut);margin-bottom:36px;font-weight:500}
#dots{display:flex;gap:18px;margin-bottom:24px}
#dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--dim);transition:.25s}
#dots i.on{background:var(--acc);border-color:var(--acc);box-shadow:0 0 16px var(--acc);transform:scale(1.15)}
#dots.err i{border-color:var(--red)}#dots.err i.on{background:var(--red);border-color:var(--red)}
#lockMsg{font-size:13px;color:var(--dim);height:18px;margin-bottom:20px;font-weight:500}
#pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px}
#pad button{width:78px;height:78px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);backdrop-filter:blur(10px);color:var(--txt);font-size:25px;font-weight:500;cursor:pointer;transition:.15s;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#pad button:active{background:rgba(255,255,255,.22);transform:scale(.9);box-shadow:0 0 26px rgba(192,132,252,.4)}
#pad .fn{background:transparent;border-color:transparent;box-shadow:none;font-size:18px;color:var(--mut)}
#lock.shake{animation:shake .4s}@keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
#hub{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;padding-top:calc(env(safe-area-inset-top) + 24px);opacity:0;transform:translateY(24px);pointer-events:none;transition:.6s cubic-bezier(.4,0,.2,1)}
#hub.on{opacity:1;transform:none;pointer-events:auto}
.hubHead{width:100%;padding:0 24px;display:flex;justify-content:space-between;align-items:flex-start}
.greet{font-size:24px;font-weight:700;letter-spacing:-.5px}
.hubDate{font-size:13px;color:var(--mut);margin-top:3px;font-weight:500}
.hubClock{font-family:var(--mono);font-size:14px;font-weight:600;padding:8px 14px;border-radius:20px;background:linear-gradient(135deg,rgba(192,132,252,.2),rgba(244,114,182,.15));border:1px solid rgba(192,132,252,.35);color:#fff}
.gear{width:40px;height:40px;border-radius:50%;border:1px solid var(--brd);background:var(--card);font-size:17px;cursor:pointer;transition:.4s;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.gear:active{transform:rotate(120deg) scale(.88)}
.wxcard{display:flex;align-items:center;gap:14px;width:calc(100% - 48px);margin:14px 0 0;padding:13px 16px;background:var(--card);border:1px solid var(--brd);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.wxI{font-size:30px;filter:drop-shadow(0 0 12px rgba(192,132,252,.4))}
.wxT b{font-family:var(--mono);font-size:22px}
.wxT small{display:block;font-size:11px;color:var(--mut)}
.wxC{margin-left:auto;display:flex;flex-direction:column;gap:2px;font-size:10.5px;color:var(--mut);text-align:right}
.uname{width:calc(100% - 48px);margin-top:16px;font-family:'Unbounded',sans-serif;font-size:15px;font-weight:600;text-transform:uppercase;text-align:left;letter-spacing:.06em}
.uname span{display:inline-block;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 12px rgba(192,132,252,.5));animation:letterIn .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes letterIn{0%{opacity:0;transform:translateY(24px) scale(.5) rotateX(75deg);filter:blur(9px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none;filter:drop-shadow(0 0 12px rgba(192,132,252,.5))}}
.wm{flex-shrink:0;margin:0 0 calc(env(safe-area-inset-bottom) + 62px);font-family:'Marcellus',serif;font-size:24px;letter-spacing:.3em;color:rgba(244,240,251,.16);pointer-events:none;white-space:nowrap;text-align:center}
#scene{flex:1;width:100%;display:flex;align-items:center;justify-content:center;perspective:1000px;position:relative;touch-action:none}
#rotor{position:absolute;top:50%;left:50%;width:0;height:0;transform-style:preserve-3d}
.ring{position:absolute;top:50%;left:50%;border-radius:50%;border:1.5px solid rgba(192,132,252,.3);transform:rotateX(90deg);pointer-events:none;box-shadow:0 0 20px rgba(192,132,252,.2)}
.ring2{position:absolute;top:50%;left:50%;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;border:1.5px solid rgba(244,114,182,.2);transform:rotateX(70deg) rotateY(30deg);pointer-events:none}
#voiceCore{position:absolute;top:50%;left:50%;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #e4d3ff 0%, #a78bfa 40%, #6d28d9 80%, #1e1145 100%);
  box-shadow:0 0 55px rgba(167,139,250,.85),0 0 25px rgba(192,132,252,.6),inset 0 0 24px rgba(255,255,255,.4),inset -6px -8px 18px rgba(0,0,40,.5);
  display:flex;align-items:center;justify-content:center;cursor:pointer;will-change:transform;user-select:none;-webkit-user-select:none;transition:filter .18s ease}
#voiceCore:active{filter:brightness(1.25)}
#voiceCore .g-letter{font-family:'Marcellus',serif;font-size:54px;font-weight:700;color:#fff;
  text-shadow:0 0 18px rgba(192,132,252,1),0 0 40px rgba(167,139,250,.85),0 2px 4px rgba(0,0,60,.75);line-height:1;padding-bottom:6px;letter-spacing:-2px}
#voiceCore.listening{animation:corePulse 1.1s ease-in-out infinite}
@keyframes corePulse{
  0%,100%{box-shadow:0 0 35px rgba(167,139,250,.75),0 0 60px rgba(192,132,252,.5),inset 0 0 24px rgba(255,255,255,.4),inset -6px -8px 18px rgba(0,0,40,.5)}
  50%{box-shadow:0 0 90px rgba(244,114,182,1),0 0 50px rgba(192,132,252,.95),0 0 120px rgba(167,139,250,.6),inset 0 0 38px rgba(255,255,255,.65),inset -6px -8px 18px rgba(0,0,40,.5);filter:brightness(1.15)}}
.sphere{position:absolute;top:50%;left:50%;width:96px;height:96px;margin:-48px 0 0 -48px;cursor:pointer;will-change:transform}
.sph-in{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 32% 28%,var(--sc2),var(--sc3) 78%);box-shadow:inset 0 2px 10px rgba(255,255,255,.3),inset 0 -8px 22px rgba(0,0,0,.5),0 14px 40px rgba(0,0,0,.6),0 0 30px var(--sc2);border:1.5px solid rgba(255,255,255,.25)}
.sph-in::before{content:'';position:absolute;top:12%;left:18%;width:34%;height:26%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.7),transparent 70%);filter:blur(4px)}
.sph-ic{width:42px;height:42px;stroke:#fff;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 9px rgba(255,255,255,.55))}
.sph-lb{position:absolute;bottom:-27px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--mut);white-space:nowrap;text-shadow:0 2px 8px #000}
.sphere:active .sph-in{box-shadow:0 0 50px var(--sc2),inset 0 2px 10px rgba(255,255,255,.3)}
.app{position:fixed;inset:0;z-index:20;background:linear-gradient(180deg,#0a0614,#0d0819);opacity:0;transform:translateY(28px) scale(.97);pointer-events:none;transition:.4s cubic-bezier(.4,0,.2,1);overflow-y:auto;overflow-x:hidden;padding:calc(env(safe-area-inset-top) + 10px) 18px calc(env(safe-area-inset-bottom) + 60px)}
.app.open{opacity:1;transform:none;pointer-events:auto}
.ahead{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;padding:8px 2px 14px;background:linear-gradient(180deg,#0a0614 70%,transparent)}
.aback{width:38px;height:38px;border-radius:13px;border:1px solid var(--brd);background:var(--card);color:var(--txt);font-size:19px;cursor:pointer;transition:.15s}
.aback:active{transform:scale(.88)}
.ahead b{font-size:19px;font-weight:700}
.abadge{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
.w{background:var(--card);border:1px solid var(--brd);border-radius:22px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.w::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--acc),var(--acc2),var(--acc3))}
.w.now{border-color:rgba(192,132,252,.45)}
.wt{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);font-weight:700;margin-bottom:14px}
.big{font-family:var(--mono);font-size:36px;font-weight:700;letter-spacing:-1px;background:linear-gradient(135deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hint{font-size:12px;color:var(--dim)}
.delta{font-family:var(--mono);font-size:13px;font-weight:600}.delta.up{color:var(--grn)}.delta.dn{color:var(--red)}
.tabsbar{position:sticky;top:52px;z-index:5;display:flex;gap:4px;padding:5px;background:var(--card);border:1px solid var(--brd);border-radius:16px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabsbar::-webkit-scrollbar{display:none}
.ftab{flex:1 0 auto;padding:9px 12px;border-radius:12px;text-align:center;font-size:11px;font-weight:700;color:var(--mut);cursor:pointer;transition:.2s;border:none;background:transparent;white-space:nowrap}
.ftab.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a0b2e;box-shadow:0 4px 16px rgba(192,132,252,.4)}
#finPanel,#taskPanel{animation:fu .3s ease}@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.donut{width:124px;height:124px;border-radius:50%;flex-shrink:0;-webkit-mask:radial-gradient(circle,transparent 52%,#000 53%);mask:radial-gradient(circle,transparent 52%,#000 53%)}
.dwrap{display:flex;gap:20px;align-items:center}
.lg{font-size:13px;line-height:2.1;font-weight:500}.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:9px}.lg b{font-family:var(--mono);color:var(--mut);font-size:12px}
.sumrow{display:flex;justify-content:space-between;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}
.sumrow div{flex:1;text-align:center}
.sumrow div:first-child{text-align:left}
.sumrow div:last-child{text-align:right}
.sumrow span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);font-weight:700;margin-bottom:5px}
.sumrow b{font-family:var(--mono);font-size:14px;font-weight:600}
.sumrow b.up{color:var(--grn)}.sumrow b.dn{color:var(--red)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.trow:last-child{border:0}
.trow .cat{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.trow .ci{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--card2);flex-shrink:0}
.trow .info{display:flex;flex-direction:column;gap:2px;min-width:0}
.trow .info span{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .info small{font-size:11px;color:var(--dim)}
.trash{width:34px;height:34px;border-radius:11px;border:none;background:rgba(251,113,133,.15);color:var(--red);font-size:15px;cursor:pointer;flex-shrink:0;transition:.15s}
.trash:active{transform:scale(.88)}
.btn{border:none;border-radius:15px;padding:16px;font-family:var(--sans);font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a0b2e;cursor:pointer;transition:.2s;width:100%;box-shadow:0 8px 24px rgba(192,132,252,.4)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--brd);box-shadow:none}
.btn.sm{width:auto;padding:10px 16px;font-size:13px;border-radius:11px}
.frow{margin-bottom:16px}
.frow label{display:block;font-size:11px;color:var(--dim);font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--brd);border-radius:13px;padding:14px 16px;color:var(--txt);font-family:var(--sans);font-size:15px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(192,132,252,.18)}
input[type=number]{font-family:var(--mono)}
select{appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 15px;border-radius:20px;border:1px solid var(--brd);background:var(--card2);font-size:13px;font-weight:600;cursor:pointer;transition:.2s;color:var(--mut)}
.chip:active{transform:scale(.94)}
.chip.sel{border-color:var(--acc);background:rgba(192,132,252,.2);color:#fff}
.search{position:relative;margin-bottom:14px}.search input{padding-left:42px}
.search::before{content:'🔍';position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5}
.task{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.task:last-child{border:0}
.task.late{border-left:3px solid var(--red);padding-left:10px}
.cb{width:24px;height:24px;border-radius:8px;border:2px solid var(--dim);cursor:pointer;transition:.2s;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;margin-top:1px}
.task.done .cb{background:var(--grn);border-color:var(--grn);color:#04210f}
.task.done .tt{text-decoration:line-through;opacity:.4}
.tt{flex:1;font-size:14px;font-weight:500;line-height:1.4;cursor:pointer}
.tt:active{opacity:.6}
.tt small{display:block;font-size:11px;color:var(--dim);margin-top:4px}
.prio{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:700;text-transform:uppercase}
.prio.high{background:rgba(251,113,133,.18);color:var(--red)}.prio.med{background:rgba(251,191,36,.18);color:var(--amb)}.prio.low{background:rgba(52,211,153,.18);color:var(--grn)}
.pbar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .8s cubic-bezier(.3,.8,.3,1)}
.cb2{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--dim);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:.2s}
.cb2.on{background:var(--grn);border-color:var(--grn);color:#04210f}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{text-align:center;font-size:10px;color:var(--dim);font-weight:700;padding:3px 0}
.cc{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-size:12px;font-weight:600;background:var(--card2);cursor:pointer;color:var(--mut);border:1px solid transparent}
.cc s{font-size:8px;color:var(--acc);text-decoration:none;font-family:var(--mono)}
.cc s.plus{color:var(--grn)}
.cc.b{background:transparent;pointer-events:none}
.cc.fut{opacity:.35;pointer-events:none}
.cc.today{border-color:var(--acc)}
.cc.sel{background:rgba(192,132,252,.25);color:#fff}
.cc .dot{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cc .dot s{width:4px;height:4px;border-radius:50%;font-size:0}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{background:var(--card2);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;border:1px solid transparent}
.mc.sel{border-color:var(--acc)}
.mc b{display:block;font-size:13px;margin-bottom:4px}
.mc s{font-size:10px;color:var(--acc);text-decoration:none;font-family:var(--mono)}
.mc s.plus{color:var(--grn)}
.ai{background:linear-gradient(135deg,rgba(192,132,252,.14),rgba(244,114,182,.07));border:1px solid rgba(192,132,252,.3);border-radius:18px;padding:15px;margin-bottom:14px;display:flex;gap:12px}
.ai.gemini{background:linear-gradient(135deg,rgba(167,139,250,.18),rgba(99,102,241,.1));border-color:rgba(167,139,250,.45)}
.ai .ic2{font-size:20px;flex-shrink:0}.ai .t{font-size:11px;font-weight:700;color:var(--acc);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.ai.gemini .t{color:#a78bfa}
.ai .b{font-size:13px;line-height:1.55}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme{border-radius:16px;padding:10px;cursor:pointer;border:2px solid transparent;text-align:center;font-size:12px;font-weight:700;color:var(--mut)}
.theme.on{border-color:var(--acc);color:#fff}
.theme .pv{height:70px;border-radius:12px;margin-bottom:8px;position:relative;overflow:hidden}
.theme .pv::after{content:'';position:absolute;width:40px;height:40px;border-radius:50%;filter:blur(14px);animation:fl1 6s ease-in-out infinite}
.pv1{background:radial-gradient(circle at 30% 30%,#a855f7,transparent 60%),radial-gradient(circle at 70% 70%,#ec4899,transparent 60%),#0a0614}
.pv1::after{background:#06b6d4;top:-10px;left:-10px}
.pv2{background:radial-gradient(circle at 30% 30%,#10b981,transparent 60%),radial-gradient(circle at 70% 70%,#06b6d4,transparent 60%),#04101a}
.pv2::after{background:#3b82f6;top:-10px;left:-10px}
.pv3{background:radial-gradient(circle at 30% 30%,#f97316,transparent 60%),radial-gradient(circle at 70% 70%,#ef4444,transparent 60%),#160a08}
.pv3::after{background:#f43f5e;top:-10px;left:-10px}
#voiceOv{position:fixed;inset:0;z-index:95;background:rgba(10,6,20,.9);backdrop-filter:blur(20px);display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 20px) 24px 30px;gap:16px}
#voiceOv.on{display:flex}
.vTop{width:100%;display:flex;justify-content:space-between;align-items:center}
.vBtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--brd);background:var(--card);font-size:17px;cursor:pointer}
.vOrb{width:120px;height:120px;border-radius:50%;margin-top:6vh;position:relative;background:
